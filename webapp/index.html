<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Массаж</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- МАНДАЛЫ -->

    <img
        src="images/mandala.png"
        class="mandala mandala-left"
        alt=""
    >

    <img
        src="images/mandala.png"
        class="mandala mandala-right"
        alt=""
    >


    <!-- ЗАСТАВКА -->

    <section
        id="splash-screen"
        class="splash-screen"
    >

        <img
            src="images/logo.png"
            class="logo splash-logo"
            alt="Логотип"
        >

    </section>


    <!-- ПРИЛОЖЕНИЕ -->

    <main
        id="app"
        class="app"
    >

        <div class="header">

            <h1>
                Запись на массаж
            </h1>

            <p class="subtitle">
                Выберите удобное время
            </p>

        </div>


        <!-- DIKIDI -->

        <div class="booking-card">

            <h2>
                Онлайн-запись
            </h2>

            <p>
                Выберите услугу, дату и удобное время
            </p>

            <button
                type="button"
                id="booking-button"
                class="booking-button"
            >
                Записаться
            </button>

        </div>


    </main>


    <!-- TELEGRAM -->

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- ТВОЙ JS -->

    <script src="app.js"></script>


</body>

</html>
