<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Массаж</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- ДЕКОР -->

    <img
        src="images/mandala.png"
        class="mandala mandala-left"
        alt=""
    >

    <img
        src="images/mandala.png"
        class="mandala mandala-right"
        alt=""
    >


    <!-- ЗАСТАВКА -->

    <section
        id="splash-screen"
        class="splash-screen"
    >

        <img
            src="images/logo.png"
            class="logo splash-logo"
            alt="Логотип"
        >

    </section>


    <!-- ПРИЛОЖЕНИЕ -->

    <main
        id="app"
        class="app"
    >

        <div class="header">

            <h1>
                Запись на массаж
            </h1>

            <p class="subtitle">
                Выберите удобное время
            </p>

        </div>


        <!-- DIKIDI -->

        <div class="dikidi-booking">

            <div
                id="dikidi-widget"
                data-dikidi-widget="215048"
            ></div>

        </div>

    </main>


    <!-- TELEGRAM MINI APP -->

    <script src="https://telegram.org/js/telegram-web-app.js"></script>


    <!-- DIKIDI WIDGET -->

    <script
        src="https://dikidi.net/assets/widget.js"
        async
    ></script>


    <!-- SPLASH -->

    <script>

        window.addEventListener(
            'load',
            function () {

                setTimeout(
                    function () {

                        const splash =
                            document.getElementById(
                                'splash-screen'
                            );

                        if (splash) {

                            splash.style.display =
                                'none';

                        }

                    },
                    1500
                );

            }
        );

    </script>

</body>

</html>
